name: Solxce
targets:
  Solxce:
    type: application
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: Solxce
        excludes:
          - "ios/**"
      - path: Generated


    settings:
      base:
        PRODUCT_NAME: Solxce
        PRODUCT_BUNDLE_IDENTIFIER: app.10x.solxce
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: 'Solxce'
        INFOPLIST_KEY_CFBundleName: 'Solxce'
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: 'UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight'
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: 'UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight'
        INFOPLIST_KEY_UIRequiresFullScreen: YES
        INFOPLIST_KEY_NSAppleMusicUsageDescription: 'Solxce accesses Apple Music so you can attach soundtrack cues and preview motivational tracks during workouts.'
        INFOPLIST_KEY_NSCalendarsFullAccessUsageDescription: 'Solxce requires calendar access to schedule, modify, and synchronize your upcoming workout events.'
        INFOPLIST_KEY_NSCalendarsUsageDescription: 'Solxce syncs your planned training sessions and athletic workouts directly to your personal calendar.'
        INFOPLIST_KEY_NSCalendarsWriteOnlyAccessUsageDescription: 'Solxce creates and updates scheduled training routines in your calendar.'
        INFOPLIST_KEY_NSCameraUsageDescription: 'Solxce uses your camera to scan meals for instant AI macro nutrition logging and capture workout progress media.'
        INFOPLIST_KEY_NSHealthShareUsageDescription: 'Solxce reads your heart rate, active energy burned, resting metabolic rate, and step counts to provide personalized athletic coaching and live telemetry.'
        INFOPLIST_KEY_NSHealthUpdateUsageDescription: 'Solxce writes completed workouts, running sessions, and nutritional intake data to Apple Health.'
        INFOPLIST_KEY_NSLocationAlwaysAndWhenInUseUsageDescription: 'Solxce uses your location in the background and foreground to accurately track your outdoor run routes, distance, splits, elevation, and live GPS telemetry.'
        INFOPLIST_KEY_NSLocationAlwaysUsageDescription: 'Solxce requires continuous background location access to map and record your long-distance running workouts even when your phone is locked.'
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: 'Solxce requires location access to map your outdoor running paths, track real-time pace, and calculate workout distance.'
        INFOPLIST_KEY_NSMicrophoneUsageDescription: 'Solxce uses the microphone to record audio during video posts and workout progress reels.'
        INFOPLIST_KEY_NSMotionUsageDescription: 'Solxce uses motion and step detection to provide real-time cadence and pace telemetry during run tracking.'
        INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: 'Solxce saves exported workout summaries, progress milestone graphics, and running route recap cards to your photo library.'
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: 'Solxce accesses your photo library so you can select and share workout photos and video reels with the community.'
        INFOPLIST_KEY_NSUserTrackingUsageDescription: 'Solxce uses app activity to provide personalized athletic coaching recommendations and community highlights.'
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: 1
        CODE_SIGN_STYLE: Automatic
        SWIFT_EMIT_LOC_STRINGS: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: Solxce/Solxce.entitlements
        ALWAYS_SEARCH_USER_PATHS: NO
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.0"
      configs:
        Debug:
          ONLY_ACTIVE_ARCH: YES
