name: Solxce
targets:
  Solxce:
    type: application
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: Solxce
        excludes:
          - "ios/**"
      - path: Generated


    settings:
      base:
        PRODUCT_NAME: Solxce
        PRODUCT_BUNDLE_IDENTIFIER: app.10x.solxce
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: 'Solxce'
        INFOPLIST_KEY_CFBundleName: 'Solxce'
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: 'UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight'
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: 'UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight'
        INFOPLIST_KEY_UIRequiresFullScreen: YES
        INFOPLIST_KEY_NSAppleMusicUsageDescription: 'Solxce accesses your media library so you can select workout soundtracks and listen to motivational audio cues during training sessions.'
        INFOPLIST_KEY_NSCalendarsFullAccessUsageDescription: 'Solxce requires full calendar access to create, update, and manage your scheduled athletic training sessions and race day events.'
        INFOPLIST_KEY_NSCalendarsUsageDescription: 'Solxce syncs your structured training calendar and scheduled workouts directly to your personal calendar.'
        INFOPLIST_KEY_NSCameraUsageDescription: 'Solxce uses your camera to scan meal plates for instant AI macronutrient recognition and capture workout form videos and progress photos.'
        INFOPLIST_KEY_NSFaceIDUsageDescription: 'Solxce uses Face ID to securely authenticate and safeguard your private fitness logs, biometric data, and account settings.'
        INFOPLIST_KEY_NSHealthClinicalHealthRecordsShareUsageDescription: 'Solxce reads authorized health records to personalize recovery protocols and training loads based on your health background.'
        INFOPLIST_KEY_NSHealthShareUsageDescription: 'Solxce reads your heart rate, active calories, resting energy, VO2 max, and step count from Apple Health to provide tailored athletic coaching and live telemetry.'
        INFOPLIST_KEY_NSHealthUpdateUsageDescription: 'Solxce writes your completed workout sessions, running splits, and nutritional intake data into Apple Health to keep your fitness history synchronized.'
        INFOPLIST_KEY_NSLocationAlwaysAndWhenInUseUsageDescription: 'Solxce uses your location in the background and foreground to track continuous outdoor run routes, splits, elevation gain, and live GPS telemetry even when your screen is locked.'
        INFOPLIST_KEY_NSLocationAlwaysUsageDescription: 'Solxce requires continuous background location access to reliably record long-distance runs and marathon training sessions when your device is locked.'
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: 'Solxce requires your location to accurately map outdoor running and cycling paths, display real-time pace, and record workout distance.'
        INFOPLIST_KEY_NSMicrophoneUsageDescription: 'Solxce requires microphone access to record audio with your workout reels, training video clips, and voice notes for AI coach analysis.'
        INFOPLIST_KEY_NSMotionUsageDescription: 'Solxce uses motion sensors and pedometer data to track cadence, step count, and movement dynamics during workouts.'
        INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: 'Solxce saves exported workout summaries, progress milestone cards, and running route recap graphics directly to your photo library.'
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: 'Solxce accesses your photo library so you can select and post training reels, progress photos, and workout achievements to the community feed.'
        INFOPLIST_KEY_NSUserTrackingUsageDescription: 'Solxce uses anonymized activity data to deliver personalized workout recommendations and improve fitness coaching algorithms.'
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: 1
        CODE_SIGN_STYLE: Automatic
        SWIFT_EMIT_LOC_STRINGS: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: Solxce/Solxce.entitlements
        ALWAYS_SEARCH_USER_PATHS: NO
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.0"
      configs:
        Debug:
          ONLY_ACTIVE_ARCH: YES
