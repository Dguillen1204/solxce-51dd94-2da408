schemaVersion: 1
project:
  ios:
    path: ios
  artifacts:
    ios:
      path: ios
    services:
      path: services
    backend:
      path: backend
appServices:
  enabled: true
  mode: backend-attached
  provider: neon
  database:
    provider: neon
    rlsRequired: true
    migrations: services/db/migrations
    policies: services/db/policies
    seeds: services/db/seeds
    dataApi:
      enabled: true
  auth:
    enabled: true
    provider: tenx-managed-better-auth
    methods:
      emailPassword: true
      apple: false
      google: false
    session:
      iosTokenBridge: true
  storage:
    provider: r2
    metadata:
      provider: neon
      table: storage.objects
    signer:
      provider: tenx-managed-storage-signer
      defaultUrlTtlSeconds: 900
    buckets: []
  clients:
    ios:
      authFacade: ios/Generated/TenxAuth.swift
      dataFacade: ios/Generated/TenxData.swift
      storageFacade: ios/Generated/TenxStorage.swift
      facade: TenXBackend
      emitClientConfig: true
backend:
  enabled: true
  product: free
  mode: app
  runtime:
    kind: python
    framework: fastapi
    version: '3.13'
  app:
    image:
      context: backend
      dockerfile: backend/Dockerfile
    service:
      command: uvicorn app.main:app --host 0.0.0.0 --port 8080
      port: 8080
      healthCheck:
        path: /healthz
        timeoutSeconds: 5
        intervalSeconds: 30
      websocket: false
    scale:
      minMachines: 0
      maxMachines: 1
      autoscale:
        enabled: false
        autoStart: true
        autoStop: suspend
        includedRunningHoursPerMonth: 20
        maxMonthlySpendCents: 0
      timeoutSeconds: 10
      monthlyRequestLimit: 10000
      clientExposedTableLimit: 5
      maxConcurrency: 5
    routes: []
  clients:
    openapi: backend/openapi.yaml
    ios:
      output: ios/Generated/BackendClient.swift
metadata:
  displayName: Solxce
  source: 10x-agent-runtime
